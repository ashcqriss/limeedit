  <script>
/*
 * LIMEdit BLOCK — shell.js
 * limesh: the interactive shell that fronts the hybrid kernel.
 *
 * Every command is arbitrated by LIMAWEK before it runs — a DOS verb flips the
 * kernel to real-mode, a Linux verb flips it back — and the *prompt itself
 * changes* to show which personality is live:
 *
 *      C:\HOME\LIME>            (DOS real-mode)
 *      [lime@limebox ~]$        (Linux / Arch)
 *
 * limesh is also a real shell, not just a dispatcher:
 *
 *      help | grep pacman            pipes (grep · head · tail · wc · sort · uniq)
 *      ls > listing.txt              redirection (> and >>)
 *      mkdir demo && cd demo         command chaining
 */
'use strict';

const Shell = (() => {
  function tokenize(line) {
    const out = []; let cur = '', q = null;
    for (const ch of line) {
      if (q) { if (ch === q) q = null; else cur += ch; }
      else if (ch === '"' || ch === "'") q = ch;
      else if (ch === ' ') { if (cur) { out.push(cur); cur = ''; } }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }

  // Split on a top-level operator, respecting quotes.
  function splitOp(line, op) {
    const parts = []; let cur = '', q = null;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === q) q = null; cur += ch; continue; }
      if (ch === '"' || ch === "'") { q = ch; cur += ch; continue; }
      if (op === '&&' && ch === '&' && line[i + 1] === '&') { parts.push(cur); cur = ''; i++; continue; }
      if (op === '|' && ch === '|' && line[i + 1] !== '|' && line[i - 1] !== '|') { parts.push(cur); cur = ''; continue; }
      cur += ch;
    }
    parts.push(cur);
    return parts;
  }

  // Trailing `> file` / `>> file` (unquoted).
  function stripRedirect(line) {
    const m = line.match(/(>>?)\s*([^\s>]+)\s*$/);
    if (!m || line.slice(0, m.index).split('"').length % 2 === 0) return { line, mode: null };
    return { line: line.slice(0, m.index).trim(), mode: m[1], target: m[2] };
  }

  // Pipe filters operate on captured plain-text lines.
  function applyFilter(lines, seg, ctx) {
    const t = tokenize(seg);
    const f = (t[0] || '').toLowerCase();
    const nArg = () => { const i = t.indexOf('-n'); if (i >= 0) return Number(t[i + 1]) || 10; if (t[1] && /^\d+$/.test(t[1])) return +t[1]; return 10; };
    if (f === 'grep') {
      if (!t[1]) { ctx.print('grep: missing pattern', 'err'); return []; }
      let re; try { re = new RegExp(t[1], 'i'); } catch (_) { ctx.print('grep: invalid pattern', 'err'); return []; }
      return lines.filter((l) => re.test(l));
    }
    if (f === 'head') return lines.slice(0, nArg());
    if (f === 'tail') return lines.slice(-nArg());
    if (f === 'wc') {
      const text = lines.join('\n');
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      return [`      ${lines.length}      ${words}      ${text.length}`];
    }
    if (f === 'sort') return [...lines].sort();
    if (f === 'uniq') return lines.filter((l, i) => l !== lines[i - 1]);
    ctx.print('limesh: unsupported pipe filter: ' + f + '  (grep|head|tail|wc|sort|uniq)', 'err');
    return lines;
  }

  // A ctx whose writers append plain text to a buffer (for pipes/redirects).
  function captureCtx(ctx, buf) {
    return {
      ...ctx,
      print: (t = '') => String(t).split('\n').forEach((l) => buf.push(l)),
      printHTML: (h = '') => { const d = document.createElement('div'); d.innerHTML = h; buf.push(d.textContent); },
      printEl: (elm) => String(elm.textContent || '').split('\n').forEach((l) => buf.push(l)),
      clear: () => { buf.length = 0; },
      registerAnim: (fn) => { try { fn(); } catch (_) {} },   // animations are meaningless in a pipe
    };
  }

  function dosPath(cwd) {
    const parts = cwd.split('/').filter(Boolean).map((s) => s.toUpperCase());
    return 'C:\\' + parts.join('\\') + '>';
  }

  // ------------------------------------------------------------ terminal
  function create(mountEl, gui, opts = {}) {
    const state = {
      cwd: '/home/lime',
      env: { USER: 'lime', HOME: '/home/lime', SHELL: '/bin/limesh', TERM: 'limeterm', PATH: '/bin:/usr/bin' },
      aliases: { ll: 'ls -l', la: 'ls -la', '..': 'cd ..' },
      history: [], histIdx: -1,
      isRoot: !!opts.root,
    };

    mountEl.classList.add('term');
    const output = document.createElement('div'); output.className = 'term-out';
    const inputLine = document.createElement('div'); inputLine.className = 'term-inputline';
    const promptEl = document.createElement('span'); promptEl.className = 'term-prompt';
    const input = document.createElement('input'); input.className = 'term-input';
    input.setAttribute('autocomplete', 'off'); input.setAttribute('spellcheck', 'false');
    inputLine.append(promptEl, input);
    mountEl.append(output, inputLine);

    const anims = [];
    const stopAnims = () => { while (anims.length) { try { anims.pop()(); } catch (_) {} } };

    function promptStr() {
      if (Kernel.LIMAWEK.personality().prompt === 'dos') return dosPath(state.cwd) + ' ';
      const cwd = state.cwd.replace('/home/lime', '~');
      return `[lime@limebox ${cwd.split('/').pop() || '/'}]$ `;
    }
    const refreshPrompt = () => { promptEl.textContent = promptStr(); promptEl.className = 'term-prompt ' + Kernel.LIMAWEK.personality().prompt; };
    const scroll = () => { mountEl.scrollTop = mountEl.scrollHeight; };

    const ctx = {
      shell: state, gui,
      registerAnim: (fn) => anims.push(fn),
      print(text = '', cls = '') { const pre = document.createElement('pre'); pre.className = 'term-line' + (cls ? ' ' + cls : ''); pre.textContent = String(text); output.appendChild(pre); scroll(); },
      printHTML(html, cls = '') { const pre = document.createElement('pre'); pre.className = 'term-line' + (cls ? ' ' + cls : ''); pre.innerHTML = html; output.appendChild(pre); scroll(); },
      printEl(elm) { output.appendChild(elm); scroll(); },
      clear() { output.innerHTML = ''; },
    };

    function echoCommand(line) {
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      const pre = document.createElement('pre');
      pre.className = 'term-line term-echo';
      pre.innerHTML = `<span class="term-prompt ${Kernel.LIMAWEK.personality().prompt}">${esc(promptStr())}</span>${esc(line)}`;
      output.appendChild(pre);
    }

    function execute(line) { stopAnims(); run(line, ctx); refreshPrompt(); scroll(); }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const line = input.value; echoCommand(line); input.value = '';
        if (line.trim()) { state.history.push(line); state.histIdx = state.history.length; }
        execute(line);
      } else if (e.key === 'ArrowUp') { if (state.histIdx > 0) { state.histIdx--; input.value = state.history[state.histIdx] || ''; } e.preventDefault(); }
      else if (e.key === 'ArrowDown') { if (state.histIdx < state.history.length - 1) { state.histIdx++; input.value = state.history[state.histIdx] || ''; } else { state.histIdx = state.history.length; input.value = ''; } e.preventDefault(); }
      else if (e.key === 'Tab') { e.preventDefault(); completeTab(); }
      else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); ctx.clear(); }
      else if (e.key === 'u' && e.ctrlKey) { e.preventDefault(); input.value = ''; }
      else if (e.key === 'c' && e.ctrlKey && !window.getSelection().toString()) { echoCommand(input.value + '^C'); input.value = ''; }
    });

    function completeTab() {
      const parts = tokenize(input.value);
      if (parts.length <= 1 && !input.value.endsWith(' ')) {
        const frag = (parts[0] || '').toLowerCase();
        const hits = Object.keys(Commands.table).filter((c) => c.startsWith(frag));
        if (hits.length === 1) input.value = hits[0] + ' ';
        else if (hits.length > 1) ctx.print(hits.join('  '), 'dim');
      } else {
        const frag = parts[parts.length - 1] || '';
        const base = frag.includes('/') ? frag.slice(0, frag.lastIndexOf('/') + 1) : '';
        const seek = frag.slice(base.length);
        const dirAbs = Kernel.fs.normalize(state.cwd, base || '.');
        if (Kernel.fs.isDir(dirAbs)) {
          const hits = Object.keys(Kernel.fs.list(dirAbs)).filter((n) => n.startsWith(seek));
          if (hits.length === 1) { parts[parts.length - 1] = base + hits[0] + (Kernel.fs.isDir(dirAbs + '/' + hits[0]) ? '/' : ''); input.value = parts.join(' '); }
          else if (hits.length > 1) ctx.print(hits.join('  '), 'dim');
        }
      }
    }

    mountEl.addEventListener('mousedown', () => setTimeout(() => input.focus(), 0));

    refreshPrompt();
    ctx.print(Kernel.fs.read('/etc/motd').replace(/\n$/, ''), 'accent');
    setTimeout(() => input.focus(), 30);

    Kernel.LIMAWEK.onChange(() => refreshPrompt());

    return { state, ctx, focus: () => input.focus(), execute };
  }

  // ------------------------------------------------------------ dispatch
  /* Run a single simple command (no operators). Kernel-switch messages go to
     msgCtx (the live terminal) even when output is being captured. */
  function dispatch(line, ctx, msgCtx) {
    msgCtx = msgCtx || ctx;
    line = String(line).trim();
    if (!line || line.startsWith('#') || /^rem\s/i.test(line)) return;

    let tokens = tokenize(line);
    const first = tokens[0];
    if (ctx.shell.aliases[first]) { tokens = tokenize(ctx.shell.aliases[first]).concat(tokens.slice(1)); line = tokens.join(' '); }

    const name = (tokens[0] || '').toLowerCase();
    const args = tokens.slice(1);
    const cmd = Commands.table[name];

    if (!cmd) {
      if (Kernel.LIMAWEK.personality().prompt === 'dos') { ctx.print('Bad command or file name', 'err'); return; }
      ctx.print(`limesh: command not found: ${tokens[0]}`, 'err');
      const guess = Object.keys(Commands.table).find((c) => c.startsWith(name.slice(0, 3)));
      if (guess) ctx.print('  did you mean `' + guess + '`?  (try `help`)', 'dim');
      return;
    }

    // LIMAWEK arbitrates: present the personality this workload's ABI needs.
    const switchLine = Kernel.LIMAWEK.require(Commands.abi(name), tokens[0]);
    if (switchLine) msgCtx.print(switchLine, 'kmsg');

    try { cmd.run(ctx, args, line); }
    catch (e) { ctx.print('limesh: ' + name + ': ' + e.message, 'err'); }
  }

  // One `&&` segment: handle redirection + pipes.
  function runSingle(line, ctx) {
    const red = stripRedirect(line);
    const stages = splitOp(red.line, '|').map((s) => s.trim()).filter(Boolean);
    if (!stages.length) return;

    if (stages.length === 1 && !red.mode) return dispatch(stages[0], ctx);

    const buf = [];
    dispatch(stages[0], captureCtx(ctx, buf), ctx);
    let lines = buf;
    for (let i = 1; i < stages.length; i++) lines = applyFilter(lines, stages[i], ctx);

    if (red.mode) {
      try {
        const abs = Kernel.fs.normalize(ctx.shell.cwd, red.target);
        const text = lines.join('\n') + (lines.length ? '\n' : '');
        if (red.mode === '>>' && Kernel.fs.isFile(abs)) Kernel.fs.write(abs, Kernel.fs.read(abs) + text);
        else Kernel.fs.write(abs, text);
      } catch (e) { ctx.print('limesh: redirect: ' + e.message, 'err'); }
    } else {
      lines.forEach((l) => ctx.print(l));
    }
  }

  // Public entry: full command line with && chaining.
  function run(line, ctx) {
    for (const seg of splitOp(String(line), '&&')) {
      const s = seg.trim();
      if (s) runSingle(s, ctx);
    }
  }

  return { create, run, tokenize };
})();
window.Shell = Shell;

  <script>
/*
 * LIMEdit BLOCK — apps.js
 * The GUI applications. Each factory (name, gui, meta) returns
 * { title, icon, node, w, h, onClose? }.
 *
 * The browser is the flagship "detailed fallback-GUI" app: with the fallback
 * GUI ALLOWED it renders full chrome (toolbar + bookmarks bar + rich pages);
 * DISABLED, it degrades to a lightweight, shell-first view.
 */
'use strict';

const Apps = (() => {
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

  // ------------------------------------------------------------ Browser
  const SITES = {
    'lime://welcome': () => `
      <div class="pg-hero">
        <div class="pg-logo">🟩</div>
        <h1>Welcome to LIMEdit BLOCK</h1>
        <p>The operating system where the GUI <em>is</em> the terminal. A hybrid
        kernel — arbitrated by <b>LIMAWEK</b> — welds <b>Arch Linux</b> to the
        classic <b>MS-DOS</b> command set.</p>
        <div class="pg-links">
          <a href="#" data-go="arch://wiki">Arch-style wiki ▸</a>
          <a href="#" data-go="dos://prompt">DOS prompt lore ▸</a>
          <a href="#" data-go="block://apps">Get apps ▸</a>
        </div>
        <h2 class="pg-h2">🌍 Real internet</h2>
        <p class="pg-dim">Type any address or search words in the bar above — this
        browser loads the actual web. Some sites refuse to be embedded; use the
        ↗ button to pop them out.</p>
        <div class="pg-links">
          <a href="#" data-go="https://example.com">example.com ▸</a>
          <a href="#" data-go="https://en.wikipedia.org/wiki/MS-DOS">wikipedia: MS-DOS ▸</a>
          <a href="#" data-go="https://archlinux.org">archlinux.org ▸</a>
        </div>
      </div>`,
    'arch://wiki': () => `
      <h1>BLOCK Wiki — pacman</h1>
      <p>BLOCK inherits Arch's rolling-release philosophy and the <code>pacman</code>
      package manager.</p>
      <pre>pacman -Syu           # upgrade the whole system
pacman -S firefox     # install a package
pacman -Ss editor     # search the repos
pacman -Q             # list installed packages
run firefox           # LIMAWEK services it on the Linux kernel</pre>
      <p>Try any of these back in the console. <a href="#" data-go="lime://welcome">◂ home</a></p>`,
    'dos://prompt': () => `
      <h1>The DOS heritage</h1>
      <p>Under the lime skin, COMMAND.COM lives on. Every classic verb still works,
      case-insensitively — and pulls the hybrid kernel into real-mode:</p>
      <pre>C:\\HOME\\LIME&gt; DIR
C:\\HOME\\LIME&gt; TYPE readme.txt
C:\\HOME\\LIME&gt; VER
C:\\HOME\\LIME&gt; CLS</pre>
      <p>Type <code>dos</code> for the immersive CRT session. Modelled on
      <b>microsoft/MS-DOS</b> (MIT). <a href="#" data-go="lime://welcome">◂ home</a></p>`,
    'block://apps': () => `
      <h1>BLOCK App Store</h1>
      <ul class="pg-apps">
        <li><b>block-browser</b> — you're using it. <code>pacman -S block-browser</code></li>
        <li><b>htop</b> — process viewer. <code>pacman -S htop && run htop</code></li>
        <li><b>cmatrix</b> — digital rain. <code>pacman -S cmatrix</code> then <code>matrix</code></li>
        <li><b>neofetch</b> — flex your specs. <code>neofetch</code></li>
        <li><b>block-doom</b> — someone always ports it. <code>pacman -S block-doom</code></li>
      </ul>
      <a href="#" data-go="lime://welcome">◂ home</a>`,
  };
  const INTERNAL = /^(lime|arch|dos|block):\/\//;
  function litePage() {
    return `<h1>Real-web browsing needs the detailed GUI</h1>
      <p>The lightweight, shell-first browser only renders BLOCK's built-in pages.
      Loading the <b>actual internet</b> is a rich-chrome feature.</p>
      <pre>fallback-gui ~allow</pre>
      <p>Run that in the console, close this window, and reopen the browser.</p>
      <p><a href="#" data-go="lime://welcome">◂ home</a></p>`;
  }

  function browser(gui, meta = {}) {
    const rich = gui.fallback();
    const root = el('div', 'browser' + (rich ? ' rich' : ' lite'));

    if (!rich) {
      root.appendChild(el('div', 'lite-note',
        '⚠ Fallback-GUI is <b>disabled</b> — showing the lightweight, shell-first browser.<br>' +
        'Run <code>fallback-gui ~allow</code> in the console for the full, detailed browser.'));
    }

    const bar = el('div', 'br-bar');
    const back = el('button', 'br-btn', '◂');
    const fwd = el('button', 'br-btn', '▸');
    const reload = el('button', 'br-btn', '⟳');
    const addr = el('input', 'br-addr');
    const go = el('button', 'br-btn br-go', 'Go');
    bar.append(back, fwd, reload, addr, go);
    const page = el('div', 'br-page');
    root.appendChild(bar);
    if (rich) {                          // bookmarks bar is part of the rich chrome
      const marks = el('div', 'br-marks');
      for (const url of Object.keys(SITES)) {
        const b = el('button', 'br-mark', url.replace('://', ' · '));
        b.onclick = () => navigate(url);
        marks.appendChild(b);
      }
      root.appendChild(marks);
    }
    root.appendChild(page);

    const start = meta.url || 'lime://welcome';
    const hist = [start]; let hi = 0;

    // A real web page: an <iframe> onto the actual internet, with an info bar
    // and a pop-out button for sites that refuse to be embedded.
    function renderWeb(url) {
      page.innerHTML = '';
      page.classList.add('br-webpage');
      const info = el('div', 'br-info',
        `<span>🌍 real internet — if the page stays blank, the site refuses embedding</span>`);
      const pop = el('a', 'br-pop', 'open ↗');
      pop.href = url; pop.target = '_blank'; pop.rel = 'noopener noreferrer';
      info.appendChild(pop);
      const frame = document.createElement('iframe');
      frame.className = 'br-frame';
      frame.src = url;
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
      frame.referrerPolicy = 'no-referrer';
      page.append(info, frame);
    }

    function render(url) {
      addr.value = url;
      page.classList.remove('br-webpage');
      const fn = SITES[url];
      if (fn) page.innerHTML = fn();
      else if (!rich) page.innerHTML = litePage();
      else return renderWeb(url);
      page.querySelectorAll('[data-go]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); navigate(a.dataset.go); }));
    }
    function navigate(url) {
      url = url.trim();
      if (!INTERNAL.test(url) && !/^https?:\/\//i.test(url)) {
        if (SITES['lime://' + url]) url = 'lime://' + url;                       // bare internal name
        else if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(url)) url = 'https://' + url; // bare domain
        else url = 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(url); // search
      }
      hist.splice(hi + 1); hist.push(url); hi = hist.length - 1; render(url);
    }
    back.onclick = () => { if (hi > 0) render(hist[--hi]); };
    fwd.onclick = () => { if (hi < hist.length - 1) render(hist[++hi]); };
    reload.onclick = () => render(hist[hi]);
    go.onclick = () => navigate(addr.value.trim());
    addr.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(addr.value.trim()); });
    render(start);

    return { title: 'BLOCK Browser', icon: '🌐', node: root, w: 740, h: 520 };
  }

  // ------------------------------------------------------------ Files
  const EXT_ICON = { md: '📘', txt: '📄', js: '📜', json: '🧾', log: '🧾', sys: '⚙️' };
  function fileIcon(name, isDir) {
    if (isDir) return '📁';
    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
    return EXT_ICON[ext] || '📄';
  }

  function files(gui, meta = {}) {
    const root = el('div', 'files');
    const tools = el('div', 'files-tools');
    const bNewF = el('button', 'br-btn', 'New File');
    const bNewD = el('button', 'br-btn', 'New Folder');
    const bDel = el('button', 'br-btn', 'Delete');
    const bRef = el('button', 'br-btn', '⟳');
    tools.append(bNewF, bNewD, bDel, bRef);
    const path = el('div', 'files-path');
    const list = el('div', 'files-list');
    const prev = el('pre', 'files-preview', '');
    const grid = el('div', 'files-grid');
    grid.append(list, prev);
    root.append(tools, path, grid);

    let cwd = meta.path || '/home/lime';
    let selected = null;

    function crumbs(abs) {
      path.innerHTML = '';
      const segs = abs.split('/').filter(Boolean);
      const mk = (label, target) => {
        const b = el('button', 'files-crumb', label);
        b.onclick = () => open(target);
        path.appendChild(b);
      };
      mk('/', '/');
      let acc = '';
      for (const s of segs) { acc += '/' + s; path.appendChild(el('span', null, '›')); mk(s, acc); }
    }

    function open(abs) {
      cwd = abs; selected = null; prev.textContent = '';
      crumbs(abs);
      list.innerHTML = '';
      if (abs !== '/') {
        const up = el('div', 'file-row dir', '📁 ..');
        up.ondblclick = () => open(abs.split('/').slice(0, -1).join('/') || '/');
        up.onclick = up.ondblclick;
        list.appendChild(up);
      }
      for (const [name, n] of Object.entries(Kernel.fs.list(abs))) {
        const isDir = n.type === 'dir';
        const row = el('div', 'file-row ' + (isDir ? 'dir' : 'file'));
        row.append(el('span', null, fileIcon(name, isDir)), document.createTextNode(' ' + name));
        row.appendChild(el('span', 'file-meta', isDir ? '—' : n.content.length + ' B'));
        const full = abs === '/' ? '/' + name : abs + '/' + name;
        row.onclick = () => {
          list.querySelectorAll('.file-row').forEach((r) => r.classList.remove('sel'));
          row.classList.add('sel');
          selected = { full, isDir };
          prev.textContent = isDir ? '' : Kernel.fs.read(full);
        };
        row.ondblclick = () => { if (isDir) open(full); else gui.openApp('editor', { path: full }); };
        list.appendChild(row);
      }
    }

    bRef.onclick = () => open(cwd);
    bNewF.onclick = () => { const name = prompt('New file name:'); if (!name) return; try { Kernel.fs.write(Kernel.fs.normalize(cwd, name), ''); open(cwd); } catch (e) { alert(e.message); } };
    bNewD.onclick = () => { const name = prompt('New folder name:'); if (!name) return; try { Kernel.fs.mkdir(Kernel.fs.normalize(cwd, name)); open(cwd); } catch (e) { alert(e.message); } };
    bDel.onclick = () => { if (!selected) return; try { Kernel.fs.remove(selected.full); open(cwd); } catch (e) { alert(e.message); } };

    open(cwd);
    return { title: 'Files', icon: '🗂️', node: root, w: 660, h: 440 };
  }

  // ------------------------------------------------------------ About
  function about() {
    const root = el('div', 'about');
    const n = Neofetch.render();
    const head = el('div', 'about-head',
      `<div class="about-logo">🟩</div><div><h1>LIMEdit BLOCK</h1>
       <div class="about-ver">Version ${Kernel.system.version} “${Kernel.system.codename}” · archdos-hybrid 1.0</div></div>`);
    root.append(head, n.el);
    root.appendChild(el('div', 'about-info',
      `<p>A modern operating environment built around a <b>hybrid kernel</b>:
      LIMAWEK arbitrates between an <b>MS-DOS real-mode</b> personality and a
      <b>Linux (Arch)</b> kernel, switching wherever each workload needs.</p>`));
    root.appendChild(el('div', 'about-credit',
      'Modelled on two officially open-sourced code bases: Arch Linux (pacman, rolling userland) ' +
      'and microsoft/MS-DOS (MIT). Desktop chrome in the spirit of Mac OS 9.2.2 “Platinum”. ' +
      'Everything runs client-side; no real disk is touched.'));
    return { title: 'About This System', icon: 'ℹ️', node: root, w: 660, h: 580, onClose: () => n.stop() };
  }

  // ------------------------------------------------------------ Editor
  function editor(gui, meta = {}) {
    const root = el('div', 'editor');
    const bar = el('div', 'ed-bar');
    const pathIn = el('input', 'ed-path');
    pathIn.value = meta.path || '/home/lime/readme.txt';
    const load = el('button', 'br-btn', 'Open');
    const save = el('button', 'br-btn', 'Save');
    bar.append(pathIn, load, save);
    const ta = el('textarea', 'ed-area');
    ta.spellcheck = false;
    const status = el('div', 'ed-status');
    const posEl = el('span', null, 'Ln 1, Col 1');
    const lenEl = el('span', null, '0 chars');
    const kernEl = el('span', null, 'linux · arch userland');
    status.append(posEl, lenEl, kernEl);
    root.append(bar, ta, status);

    function refreshStatus() {
      const upto = ta.value.slice(0, ta.selectionStart);
      const ln = upto.split('\n').length;
      const col = upto.length - upto.lastIndexOf('\n');
      posEl.textContent = `Ln ${ln}, Col ${col}`;
      lenEl.textContent = ta.value.length + ' chars';
    }
    ta.addEventListener('input', refreshStatus);
    ta.addEventListener('keyup', refreshStatus);
    ta.addEventListener('click', refreshStatus);

    function doLoad() {
      const abs = Kernel.fs.normalize('/home/lime', pathIn.value);
      ta.value = Kernel.fs.isFile(abs) ? Kernel.fs.read(abs) : '';
      refreshStatus();
    }
    load.onclick = doLoad;
    save.onclick = () => {
      try {
        Kernel.fs.write(Kernel.fs.normalize('/home/lime', pathIn.value), ta.value);
        save.textContent = 'Saved ✓'; setTimeout(() => (save.textContent = 'Save'), 1000);
      } catch (e) { alert(e.message); }
    };
    doLoad();
    return { title: 'BLOCK Editor', icon: '📝', node: root, w: 660, h: 480 };
  }

  // ------------------------------------------------------------ Settings
  function mkSwitch(checked, onchange) {
    const label = el('label', 'switch');
    const input = document.createElement('input');
    input.type = 'checkbox'; input.checked = checked;
    input.addEventListener('change', () => onchange(input.checked));
    label.append(input, el('i'));
    return label;
  }

  function settings(gui) {
    const root = el('div', 'settings');
    root.append(el('h1', null, 'System Preferences'));

    root.append(el('h2', null, 'Appearance'));
    const rowTheme = el('div', 'set-row', '<span>Dark theme</span>');
    rowTheme.appendChild(mkSwitch(document.documentElement.dataset.theme === 'dark', (on) => {
      if (on) document.documentElement.dataset.theme = 'dark';
      else delete document.documentElement.dataset.theme;
      try { localStorage.setItem('block.theme', on ? 'dark' : 'light'); } catch (_) {}
    }));
    const rowWall = el('div', 'set-row', '<span>Wallpaper</span>');
    const sw = el('div', 'wp-swatches');
    for (const name of gui.wallpapers()) {
      const b = el('button', 'wp-sw ' + name + (gui.wallpaper() === name ? ' on' : ''));
      b.title = name;
      b.onclick = () => { gui.setWallpaper(name); sw.querySelectorAll('.wp-sw').forEach((x) => x.classList.remove('on')); b.classList.add('on'); };
      sw.appendChild(b);
    }
    rowWall.appendChild(sw);
    root.append(rowTheme, rowWall);

    root.append(el('h2', null, 'Windows & motion'));
    const rowFb = el('div', 'set-row', '<span>Fallback-GUI (rich app chrome)</span>');
    rowFb.appendChild(mkSwitch(gui.fallback(), (on) => gui.setFallback(on)));
    const rowMotion = el('div', 'set-row', '<span>Animations</span>');
    rowMotion.appendChild(mkSwitch(gui.motion(), (on) => gui.setMotion(on)));
    root.append(rowFb, rowMotion);

    root.append(el('p', 'pg-dim', 'These mirror the `theme`, `wallpaper`, and `fallback-gui` shell commands.'));
    return { title: 'System Preferences', icon: '⚙️', node: root, w: 500, h: 430 };
  }

  // ------------------------------------------------------------ Monitor
  function monitor() {
    const root = el('div', 'monitor');
    const head = el('div', 'mon-head');
    const rows = el('div', 'mon-rows');
    root.append(head, rows);

    function render() {
      const used = Kernel.memUsedMb(), tot = Kernel.system.memTotalMb;
      head.textContent = `Memory ${(used / 1024).toFixed(1)} / ${(tot / 1024).toFixed(1)} GiB · Uptime ${Kernel.uptime()} · Kernel ${Kernel.LIMAWEK.personality().name}`;
      rows.innerHTML = '';
      const hdr = el('div', 'mon-row hdr');
      ['pid', 'command', 'cpu', '%', 'mem', ''].forEach((h) => hdr.appendChild(el('span', null, h)));
      rows.appendChild(hdr);
      for (const p of Kernel.processes) {
        p.cpu = Math.max(0, Math.min(9.9, +(p.cpu + (Math.random() - 0.5)).toFixed(1)));
        const row = el('div', 'mon-row');
        row.appendChild(el('span', null, String(p.pid)));
        row.appendChild(el('span', null, p.name + ' <span style="opacity:.5">· ' + (p.abi || 'linux') + '</span>'));
        const bar = el('div', 'mon-cpu'); bar.appendChild(el('i')).style.width = Math.min(100, p.cpu * 10) + '%';
        row.appendChild(bar);
        row.appendChild(el('span', null, p.cpu.toFixed(1)));
        row.appendChild(el('span', null, p.mem + 'M'));
        const kill = el('button', 'mon-kill', '✕');
        kill.title = 'End process';
        if (p.pid < 10) { kill.disabled = true; kill.title = 'System process'; }
        else kill.onclick = () => { Kernel.kill(p.pid); render(); };
        row.appendChild(kill);
        rows.appendChild(row);
      }
    }
    render();
    const id = setInterval(render, 1200);
    return { title: 'Activity Monitor', icon: '📊', node: root, w: 560, h: 440, onClose: () => clearInterval(id) };
  }

  const registry = { browser, files, about, editor, settings, monitor };

  return {
    create(name, gui, meta) {
      const fn = registry[name];
      return fn ? fn(gui, meta || {}) : null;
    },
    names: () => Object.keys(registry),
  };
})();
window.Apps = Apps;

</script>
  <script>
/*
 * LIMEdit BLOCK — gui.js
 * BlockWM / Block9: the always-on, System-9.2.2-styled window manager.
 *
 * The rule "the GUI is the terminal" is literal: BlockWM boots a maximized
 * *root console* that can never be closed, so the WM always has at least one
 * window to manage. Everything else — apps, and third-party Linux binaries
 * launched with `run` — floats above it as draggable, resizable, minimizable
 * windows with Platinum pinstriped title bars.
 *
 * Desktop furniture: a Platinum menu bar with a System-9-style Application
 * menu (far right), desktop icons that float on the console, and a launcher
 * dock with running indicators.
 */
'use strict';

const GUI = (() => {
  const windowsEl = () => document.getElementById('windows');
  const dockEl = () => document.getElementById('dock');
  const menuDrop = () => document.getElementById('menu-drop');

  let z = 10;
  let fallbackAllowed = false;
  let dosMode = false;
  const openWins = [];
  let termCount = 0;
  let activeTerminal = null;
  let rootConsole = null;
  let focused = null;
  let drag = null, resize = null;

  const WALLPAPERS = ['lime', 'platinum', 'dusk', 'noir'];
  let wallpaper = 'lime';

  const LAUNCHERS = [
    ['terminal', '▤', 'Terminal'],
    ['browser', '🌐', 'Browser'],
    ['files', '🗂️', 'Files'],
    ['editor', '📝', 'Editor'],
    ['monitor', '📊', 'Monitor'],
    ['settings', '⚙️', 'Settings'],
  ];

  const store = {
    get: (k) => { try { return localStorage.getItem('block.' + k); } catch (_) { return null; } },
    set: (k, v) => { try { localStorage.setItem('block.' + k, v); } catch (_) {} },
  };

  // ---------------------------------------------------------- badges
  function updateWmBadge() {
    const b = document.getElementById('mb-wm');
    if (b) b.textContent = '▚ BlockWM · ' + openWins.length + (openWins.length === 1 ? ' win' : ' wins');
  }
  function updateAppWinMenu() {
    const b = document.getElementById('mb-appwin');
    if (!b) return;
    const rec = focused || rootConsole;
    if (rec) b.textContent = (rec.spec.icon || '▢') + ' ' + rec.spec.title.split(' — ')[0];
  }
  function updateDockDots() {
    document.querySelectorAll('.dock-btn[data-app]').forEach((btn) => {
      const app = btn.dataset.app;
      btn.classList.toggle('running', openWins.some((r) => r.appName === app));
    });
  }
  function refreshChrome() { updateWmBadge(); updateAppWinMenu(); updateDockDots(); }

  // ---------------------------------------------------------- window
  function focusRec(rec) {
    if (!rec) return;
    if (!rec.spec.root) rec.win.style.zIndex = ++z;
    openWins.forEach((r) => r.win.classList.toggle('active', r === rec));
    focused = rec;
    if (rec.spec.isTerminal) activeTerminal = rec;
    updateAppWinMenu();
  }

  function minimizeRec(rec) {
    rec.win.classList.add('minimizing');
    setTimeout(() => {
      rec.win.classList.remove('minimizing');
      rec.win.classList.add('minimized');
      if (focused === rec) { focused = openWins.filter((r) => !r.win.classList.contains('minimized')).pop() || null; if (focused) focusRec(focused); }
      refreshChrome();
    }, 210);
  }
  function restoreRec(rec) {
    rec.win.classList.remove('minimized', 'minimizing');
    focusRec(rec);
    refreshChrome();
  }

  function makeWindow(spec, contentNode) {
    const id = 'w' + (++z);
    const win = document.createElement('section');
    win.className = 'win' + (spec.root ? ' win-root' : '');
    win.style.zIndex = spec.root ? 1 : ++z;
    if (!spec.root) {
      // Clamp size + cascade position so the window always fits the desktop
      // (keeps the resize grip reachable).
      const area = windowsEl().getBoundingClientRect();
      const w = Math.min(spec.w || 560, Math.max(320, area.width - 24));
      const h = Math.min(spec.h || 400, Math.max(180, area.height - 20));
      win.style.width = w + 'px'; win.style.height = h + 'px';
      win.style.left = Math.max(6, Math.min(70 + (openWins.length % 6) * 36, area.width - w - 12)) + 'px';
      win.style.top = Math.max(30, Math.min(58 + (openWins.length % 6) * 32, area.height - h - 10)) + 'px';
    }

    const title = document.createElement('div');
    title.className = 'win-title';
    title.innerHTML =
      `<span class="win-lights">` +
      `<i class="lc lc-close${spec.root ? ' lc-off' : ''}" title="${spec.root ? 'Root console — cannot close' : 'Close'}"></i>` +
      `<i class="lc lc-min" title="Minimise"></i><i class="lc lc-zoom" title="Zoom"></i></span>` +
      `<span class="win-name">${spec.icon || ''} ${spec.title}</span>` +
      (spec.procName ? `<span class="win-proc">pid ${spec.pid} · linux</span>` : '<span></span>');
    const body = document.createElement('div');
    body.className = 'win-body';
    body.appendChild(contentNode);
    win.append(title, body);
    windowsEl().appendChild(win);

    const rec = { id, win, spec, appName: spec.appName || null };
    openWins.push(rec);

    win.addEventListener('mousedown', () => focusRec(rec));
    focusRec(rec);

    if (!spec.root) {
      // drag by title bar
      title.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('lc')) return;
        drag = { rec, x: e.clientX, y: e.clientY, l: win.offsetLeft, t: win.offsetTop };
        e.preventDefault();
      });
      // resize grip
      const grip = document.createElement('div');
      grip.className = 'win-grip';
      grip.title = 'Resize';
      win.appendChild(grip);
      grip.addEventListener('mousedown', (e) => {
        resize = { rec, x: e.clientX, y: e.clientY, w: win.offsetWidth, h: win.offsetHeight };
        e.preventDefault(); e.stopPropagation();
      });
    }
    title.addEventListener('dblclick', (e) => { if (!e.target.classList.contains('lc')) win.classList.toggle('zoomed'); });

    title.querySelector('.lc-close').onclick = () => { if (!spec.root) closeWin(rec); };
    title.querySelector('.lc-min').onclick = () => minimizeRec(rec);
    title.querySelector('.lc-zoom').onclick = () => win.classList.toggle('zoomed');

    refreshChrome();
    return rec;
  }

  window.addEventListener('mousemove', (e) => {
    if (drag) {
      drag.rec.win.style.left = Math.max(0, drag.l + e.clientX - drag.x) + 'px';
      drag.rec.win.style.top = Math.max(30, drag.t + e.clientY - drag.y) + 'px';
    } else if (resize) {
      resize.rec.win.style.width = Math.max(320, resize.w + e.clientX - resize.x) + 'px';
      resize.rec.win.style.height = Math.max(180, resize.h + e.clientY - resize.y) + 'px';
    }
  });
  window.addEventListener('mouseup', () => { drag = null; resize = null; });

  function closeWin(rec) {
    if (rec.spec.root) return;
    if (rec.spec.onClose) try { rec.spec.onClose(); } catch (_) {}
    rec.win.remove();
    const i = openWins.indexOf(rec); if (i >= 0) openWins.splice(i, 1);
    if (activeTerminal === rec) activeTerminal = openWins.filter((r) => r.spec.isTerminal).slice(-1)[0] || rootConsole;
    if (focused === rec) { focused = null; focusRec(openWins.filter((r) => !r.win.classList.contains('minimized')).pop() || rootConsole); }
    refreshChrome();
  }

  // ---------------------------------------------------------- kernel UI
  function reflectKernel() {
    const mode = Kernel.LIMAWEK.mode();
    const p = Kernel.personalities[mode];
    const badge = document.getElementById('mb-kernel');
    if (badge) badge.textContent = (mode === 'dos' ? '◆ dos·real-mode' : '◆ arch·' + p.version.split('-')[0]);
    document.body.classList.toggle('kernel-dos', mode === 'dos');
    document.body.classList.toggle('kernel-linux', mode !== 'dos');
  }

  // ---------------------------------------------------------- API for apps/shell
  const api = {
    fallback: () => fallbackAllowed,
    setFallback(v) {
      fallbackAllowed = !!v;
      document.body.classList.toggle('fallback-on', fallbackAllowed);
      store.set('fallback', fallbackAllowed ? 'on' : 'off');
      const badge = document.getElementById('mb-fallback');
      if (badge) badge.textContent = 'GUI: ' + (fallbackAllowed ? 'rich' : 'shell');
    },
    setDosMode(v) {
      dosMode = !!v;
      document.body.classList.toggle('dosmode', dosMode);
      reflectKernel();
    },
    setWallpaper(name) {
      if (!WALLPAPERS.includes(name)) return false;
      WALLPAPERS.forEach((w) => document.body.classList.remove('wp-' + w));
      wallpaper = name;
      document.body.classList.add('wp-' + name);
      store.set('wallpaper', name);
      return true;
    },
    wallpaper: () => wallpaper,
    wallpapers: () => WALLPAPERS.slice(),
    cycleWallpaper(name) {
      if (name && api.setWallpaper(name)) return wallpaper;
      const i = (WALLPAPERS.indexOf(wallpaper) + 1) % WALLPAPERS.length;
      api.setWallpaper(WALLPAPERS[i]);
      return wallpaper;
    },
    setMotion(on) {
      document.documentElement.classList.toggle('no-motion', !on);
      store.set('motion', on ? 'on' : 'off');
    },
    motion: () => !document.documentElement.classList.contains('no-motion'),
    closeActiveTerminal() {
      if (activeTerminal && !activeTerminal.spec.root) closeWin(activeTerminal);
      else if (activeTerminal && activeTerminal.shell) activeTerminal.shell.ctx.print('limesh: the root console stays — BlockWM needs a window.', 'dim');
    },

    openApp(name, meta = {}) {
      name = String(name || '').toLowerCase();
      if (name === 'terminal' || name === 'shell' || name === 'limesh') {
        const mount = document.createElement('div');
        const rec = makeWindow({ title: 'limesh — Terminal ' + (++termCount), icon: '▤', w: 680, h: 440, isTerminal: true, appName: 'terminal' }, mount);
        rec.shell = Shell.create(mount, api);
        activeTerminal = rec;
        return rec;
      }
      const spec = Apps.create(name, api, meta);
      if (!spec) return false;
      spec.isTerminal = false;
      spec.appName = name;
      if (meta.procName) { spec.procName = meta.procName; spec.pid = meta.pid; spec.title = meta.procName + ' — ' + spec.title; }
      return makeWindow(spec, spec.node);
    },

    bootConsole() {
      const mount = document.createElement('div');
      rootConsole = makeWindow({ title: 'limesh — console (root)', icon: '▤', root: true, isTerminal: true, appName: 'terminal' }, mount);
      rootConsole.shell = Shell.create(mount, api);
      activeTerminal = rootConsole;
      return rootConsole;
    },
  };

  // ---------------------------------------------------------- menus
  // item: [label, fn, shortcut?]  |  '-'  |  fn === null → disabled
  const MENUS = {
    apple: () => [
      ['About This System', () => api.openApp('about')],
      ['System Preferences…', () => api.openApp('settings')],
      '-',
      ['Kernel & LIMAWEK', () => runInTerminal('kernel')],
      ['App Store (browser)', () => api.openApp('browser')],
      '-',
      ['Restart', () => location.reload()],
      ['Shut Down…', () => document.body.classList.add('poweroff')],
    ],
    file: () => [
      ['New Terminal', () => api.openApp('terminal'), '⌃⌥T'],
      ['New Editor', () => api.openApp('editor')],
      ['Open Files', () => api.openApp('files')],
      '-',
      ['Close Window', () => { const top = openWins.filter((r) => !r.spec.root).pop(); if (top) closeWin(top); }, '⌘W'],
    ],
    edit: () => [['Undo', null, '⌘Z'], ['Redo', null, '⇧⌘Z'], '-', ['Cut', null, '⌘X'], ['Copy', null, '⌘C'], ['Paste', null, '⌘V']],
    view: () => [
      ['Toggle Theme', () => toggleTheme()],
      ['Next Wallpaper', () => api.cycleWallpaper()],
      '-',
      ['Fallback-GUI: allow', () => api.setFallback(true)],
      ['Fallback-GUI: disable', () => api.setFallback(false)],
    ],
    special: () => [
      ['Kernel → DOS real-mode', () => runInTerminal('limawek mode dos')],
      ['Kernel → Linux (Arch)', () => runInTerminal('limawek mode linux')],
      ['Immersive MS-DOS', () => runInTerminal('dos')],
      '-',
      ['neofetch', () => runInTerminal('neofetch')],
      ['matrix', () => runInTerminal('matrix')],
      ['Empty Trash', () => runInTerminal('echo trash: already empty — BLOCK wastes nothing.')],
    ],
    apps: () => LAUNCHERS.map(([app, icon, label]) => [icon + ' ' + label, () => api.openApp(app)]),
    windows: () => openWins.map((rec) => [
      (rec === focused ? '✓ ' : rec.win.classList.contains('minimized') ? '◇ ' : '   ') +
        (rec.spec.icon || '▢') + ' ' + rec.spec.title,
      () => restoreRec(rec),
    ]),
  };

  function toggleTheme() {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
    store.set('theme', t);
  }

  function runInTerminal(line) {
    let rec = activeTerminal || rootConsole;
    if (!rec) rec = api.openApp('terminal');
    if (rec.win.classList.contains('minimized')) restoreRec(rec);
    setTimeout(() => rec.shell && rec.shell.execute(line), 20);
  }

  function openMenu(key, anchor) {
    const build = MENUS[key];
    if (!build) return;
    const drop = menuDrop();
    drop.innerHTML = '';
    for (const item of build()) {
      if (item === '-') { drop.appendChild(document.createElement('hr')); continue; }
      const [label, fn, shortcut] = item;
      const b = document.createElement('button');
      b.className = 'menu-item' + (fn ? '' : ' disabled');
      b.innerHTML = `<span></span><span class="ms">${shortcut || ''}</span>`;
      b.firstChild.textContent = label;
      if (fn) b.onclick = () => { closeMenus(); fn(); };
      drop.appendChild(b);
    }
    const r = anchor.getBoundingClientRect();
    drop.style.top = (r.bottom + 3) + 'px';
    drop.style.left = Math.min(r.left, window.innerWidth - 250) + 'px';
    drop.hidden = false;
    drop.dataset.open = key;
  }
  function closeMenus() {
    const d = menuDrop(); d.hidden = true; d.dataset.open = '';
    document.querySelectorAll('.mb-item.on').forEach((b) => b.classList.remove('on'));
  }

  function wireMenuBar() {
    document.querySelectorAll('.mb-item[data-menu]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.dataset.menu;
        if (menuDrop().dataset.open === key) { closeMenus(); return; }
        closeMenus(); btn.classList.add('on'); openMenu(key, btn);
      });
      btn.addEventListener('mouseenter', () => {
        if (menuDrop().hidden) return;
        closeMenus(); btn.classList.add('on'); openMenu(btn.dataset.menu, btn);
      });
    });
    document.addEventListener('click', closeMenus);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMenus();
      if (e.ctrlKey && e.altKey && (e.key === 't' || e.key === 'T')) { e.preventDefault(); api.openApp('terminal'); }
    });
  }

  // ---------------------------------------------------------- dock & icons
  function buildDock() {
    const dock = dockEl();
    dock.innerHTML = '';
    for (const [app, icon, label] of LAUNCHERS) {
      const btn = document.createElement('button');
      btn.className = 'dock-btn';
      btn.dataset.app = app;
      btn.innerHTML = `<span>${icon}</span><small>${label}</small><i class="dot"></i>`;
      btn.title = label;
      btn.onclick = () => {
        const recs = openWins.filter((r) => r.appName === app);
        if (!recs.length) return api.openApp(app);
        restoreRec(recs[recs.length - 1]);
      };
      dock.appendChild(btn);
    }
  }

  function buildDesktopIcons() {
    const host = document.getElementById('desktop-icons');
    if (!host) return;
    host.innerHTML = '';
    const ICONS = [
      ['💾', 'BlockFS', () => api.openApp('files', { path: '/' })],
      ['🏠', 'Home', () => api.openApp('files', { path: '/home/lime' })],
      ['🗑️', 'Trash', () => runInTerminal('echo trash: empty. BLOCK wastes nothing.')],
    ];
    for (const [icon, label, fn] of ICONS) {
      const d = document.createElement('div');
      d.className = 'dicon';
      d.innerHTML = `<i>${icon}</i><small>${label}</small>`;
      d.addEventListener('click', () => { host.querySelectorAll('.dicon').forEach((x) => x.classList.remove('sel')); d.classList.add('sel'); });
      d.addEventListener('dblclick', fn);
      host.appendChild(d);
    }
  }

  function startClock() {
    const c = document.getElementById('mb-clock');
    const tick = () => {
      const d = new Date();
      c.textContent = d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' +
        d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    };
    tick(); setInterval(tick, 1000 * 15);
  }

  function init() {
    api.setWallpaper(store.get('wallpaper') || 'lime');
    api.setFallback(store.get('fallback') === 'on');
    wireMenuBar();
    buildDock();
    buildDesktopIcons();
    startClock();
    Kernel.LIMAWEK.onChange(reflectKernel);
    reflectKernel();
    api.bootConsole();
    refreshChrome();
  }

  return { init, api, openApp: (n, m) => api.openApp(n, m), root: () => rootConsole };
})();
window.GUI = GUI;

</script>
  <script>
/*
 * LIMEdit BLOCK — boot.js
 * A two-phase power-on sequence:
 *   1. BIOS POST + real-mode DOS handoff (black, scrolling text)
 *   2. A Mac-OS-9-style "Welcome" splash — progress bar and an extension
 *      parade — while the Arch personality and BlockWM come up.
 * Then the desktop, which is really just the always-on root console.
 */
'use strict';

(function () {
  const POST = [
    'LIMEdit BLOCK BIOS v1.1  —  Power-On Self Test',
    'CPU: Citrus C9 @ 3.60GHz (8 cores) ......... OK',
    'HIMEM: Testing extended memory ............. 16384K OK',
    '',
    'Starting MS-DOS real-mode personality...',
    '  COMMAND.COM loaded (microsoft/MS-DOS compat, MIT)',
    '  8.3 filesystem, drive C: mounted',
    '',
    'Handing off to the hybrid kernel: archdos-hybrid 1.0',
    '  [ ok ] LIMAWEK — kernel arbiter — online',
    '  [ ok ] loading Linux (Arch) personality: linux 6.14.2-arch1',
  ];
  const EXT = ['🧩', '⌨️', '🖥️', '📦', '🌐', '🐧', '💾', '🍋'];

  const boot = document.getElementById('boot');
  const logEl = document.getElementById('boot-log');
  const splash = document.getElementById('boot-splash');
  const barFill = document.getElementById('boot-bar-fill');
  const extRow = document.getElementById('splash-ext');
  const desktop = document.getElementById('desktop');

  let li = 0, ei = 0, skipped = false;

  function postLine() {
    if (skipped) return;
    if (li < POST.length) {
      logEl.textContent += POST[li++] + '\n';
      setTimeout(postLine, 55 + Math.random() * 65);
    } else {
      setTimeout(splashPhase, 260);
    }
  }

  function splashPhase() {
    if (skipped) return;
    logEl.hidden = true;
    splash.hidden = false;
    extStep();
  }

  function extStep() {
    if (skipped) return;
    if (ei < EXT.length) {
      const s = document.createElement('span');
      s.textContent = EXT[ei++];
      extRow.appendChild(s);
      barFill.style.width = Math.round((ei / EXT.length) * 100) + '%';
      setTimeout(extStep, 130);
    } else {
      setTimeout(finish, 420);
    }
  }

  function finish() {
    if (desktop.hidden === false) return;      // already up
    boot.classList.add('done');
    desktop.hidden = false;
    GUI.init();                                // boots the always-on root console
    const root = GUI.root();
    // The hybrid comes up in DOS real-mode: show the DOS banner, then flex.
    setTimeout(() => {
      if (!root || !root.shell) return;
      root.shell.execute('ver');
      root.shell.execute('neofetch');
    }, 220);
    setTimeout(() => { boot.hidden = true; }, 480);
  }

  function skip() { if (!skipped) { skipped = true; finish(); } }
  boot.addEventListener('click', skip);
  window.addEventListener('keydown', function once() { skip(); window.removeEventListener('keydown', once); });
  // Works both as a standalone page and embedded in an already-loaded document.
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', () => setTimeout(postLine, 250));
  else setTimeout(postLine, 250);
})();

</script>
</body>
